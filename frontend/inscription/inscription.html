<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nzietelo — Inscription</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

  <body id="page-inscription">
    <!-- NAVIGATION — TODO (Dev FS7)
       NE PAS SUPPRIMER l'id nav-session car main.js y injecte les boutons.
       Nous allons simplement le masquer via CSS pour éviter le doublon. -->
    <div id="nav-session"></div>

    <main>
      <!-- Colonne gauche : illustration / slogan -->
      <secton class="section-gauche">
        <img
          src="../images/Mcovoit__ecov-scaled.webp"
          alt="Image Nzietelo covoiturage"
        />
        <h1>S'inscrire sur Nzietelo</h1>
        <p>
          Votre solution efficace à moindre coût de covoiturage à Brazzaville.
        </p>
      </secton>

      <!-- Colonne droite : formulaire -->
      <section class="section-droite">
        <!-- FORMULAIRE — TODO (Dev FS7)
           Respecter les IDs utilisés par main.js -->
        <form id="form-inscription">
          <h2 class="texte_h1" >Inscription</h2>
          <label for="i-nom">Nom</label>
          <input type="text" id="i-nom" />

          <label for="i-telephone">Téléphone</label>
          <input type="tel" id="i-telephone" placeholder="066123456" />

          <label for="i-mot-de-passe">Mot de passe</label>
          <input type="password" id="i-mot-de-passe" />

          <button type="submit">Créer mon compte</button>
          <span
          ><a href="login/login.html">Déjà un compte ? Se connecter</a></span
        >
        </form>

        <!-- Zone d’erreurs de validation — TODO (Dev FS7) -->
        <div id="erreurs-form" hidden></div>

        <!-- LIEN VERS LOGIN — TODO (Dev FS7) -->

        
      </secti>
    </main>

    <!-- Zone d’erreur globale — TODO (Dev FS7) -->
    <div id="erreur-globale" hidden></div>

    <script src="../functions.js"></script>
    <script src="../main.js"></script>
  </body>
