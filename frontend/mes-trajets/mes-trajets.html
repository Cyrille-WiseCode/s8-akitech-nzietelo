  <body id="page-mes-trajets">
    <nav class="accueil_navbar">
      <div>
        <span><img class="logo_navbar" width="50" height="auto" src="../images/logo.jpeg" alt="" /></span>
        <span>Nzietelo</span>

      <ul>

    <main>
      <!-- =====================================================================
         RECHERCHE PAR NUMÉRO — TODO (Dev FS5)
         *** NE PAS MODIFIER les id ci-dessous — main.js les utilise ***
         ===================================================================== -->
      <section class="barre-recherche-tel card">
        <div class="champ-recherche">
          <label for="mt-tel" class="texte_label">Téléphone</label>
          <input
            type="text"
            id="mt-tel"
            class="input-tel"
            placeholder="Votre numéro de téléphone"
          />
        </div>
        <div class="champ-recherche">
          <label for="mt-filtre-statut" class="texte_label">Statut</label>
          <select id="mt-filtre-statut" class="select-statut">
            <option value="">Tous les statuts</option>
            <option value="effectue">Effectués</option>
            <option value="en_attente">En attente</option>
            <option value="annule">Annulés</option>
          </select>
        </div>
        <button id="btn-charger-mestrajets" class="btn_principal">
          Voir mes trajets
        </button>
      </section>

      <div class="entete-liste">
        <h2 class="texte_h2">Mes réservations</h2>

        <!-- TOTAL DÉPENSÉ — TODO (Dev FS5)
           *** NE PAS MODIFIER l'id *** -->
        <p class="total-depense">
          Total dépensé : <strong id="mt-total"></strong>
        </p>
      </div>

      <!-- =====================================================================
         LISTE DES RÉSERVATIONS — TODO (Dev FS5)
         main.js remplit ce conteneur avec des cartes .carte-reservation.
         *** NE PAS MODIFIER l'id ***
         ===================================================================== -->
      <section id="mt-liste" class="liste-reservations"></section>

    <script src="../main.js"></script>
